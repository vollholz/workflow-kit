# Veröffentlichung: Nach jedem Merge auf main (und von Hand) prüft der Workflow beide Pakete und veröffentlicht jedes,
# dessen Version noch nicht auf GitHub Packages liegt (@vollholz/*). Je veröffentlichtem Paket entsteht ein Tag
# `<paket>-v<version>` (z. B. workflow-v0.1.0) und ein GitHub Release mit dem Abschnitt der Version aus
# packages/<paket>/CHANGELOG.md. Neue Version = Version in package.json erhöhen, Abschnitt in CHANGELOG.md schreiben
# (Prüfung in ci.yml), per PR mergen.
name: Release

on:
  push:
    branches: [main]
    paths: ["packages/**", "package-lock.json", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Pakete veröffentlichen
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write        # Tags und GitHub Releases
      packages: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: "@vollholz"
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Neue Versionen veröffentlichen, taggen und als GitHub Release anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in packages/*/; do
            [ -f "${p}package.json" ] || continue
            name="$(node -p "require('./${p}package.json').name")"
            version="$(node -p "require('./${p}package.json').version")"
            tag="${name#@vollholz/}-v$version"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version liegt schon vor"
              continue
            fi
            notes="$RUNNER_TEMP/notes-${name#@vollholz/}.md"
            node scripts/changelog.ts notes "$p" "$version" > "$notes"
            npm publish --workspace "$p"
            git tag -a "$tag" -m "$name@$version"
            git push origin "$tag"
            gh release create "$tag" --verify-tag --title "$name@$version" --notes-file "$notes"
            echo "veröffentlicht: $name@$version ($tag, GitHub Release)"
          done
